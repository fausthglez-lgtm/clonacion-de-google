<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- a. Header -->
    <header class="header">
        <nav class="header-nav">
            <a href="#">Gmail</a>
            <a href="#">Imágenes</a>
            <!-- Icono de aplicaciones (Grid de 9 puntos) -->
            <button class="icon-btn" aria-label="Aplicaciones de Google">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="#5f6368">
                    <path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"></path>
                </svg>
            </button>
            <!-- Foto de perfil -->
            <img class="profile-pic" src="https://lh3.googleusercontent.com/a/ACg8ocJnxOQk5I8ODlod8tq8ny3zztdnRm1NPvBbFiEa72Zpx-2_NirHlA=s180-c" alt="Foto de perfil">
        </nav>
    </header>

    <!-- b. Main -->
    <main class="main">
        <!-- Logo de Google -->
        <img class="logo" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfXuKH0i4XldTwAIF5sObGiTIuEaYJ21PxiHlq0wCsoA&s=10" alt="Google Logo">
        
        <!-- Barra de búsqueda -->
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="#9aa0a6">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
            </svg>
            <input type="text" class="search-input" autofocus>
            <svg class="mic-icon" viewBox="0 0 24 24" width="24" height="24">
                <path fill="#4285f4" d="m12 15c1.66 0 3-1.34 3-3v-6c0-1.66-1.34-3-3-3s-3 1.34-3 3v6c0 1.34 1.34 3 3 3z"/>
                <path fill="#34a853" d="m11 18.08h2v3h-2z"/>
                <path fill="#fbbc05" d="m7.05 16.87c-1.27-1.27-2.05-3.02-2.05-4.96h-2c0 2.5 1.01 4.76 2.64 6.37z"/>
                <path fill="#ea4335" d="m16.95 16.87 1.41 1.41c1.63-1.61 2.64-3.87 2.64-6.37h-2c0 1.94-.78 3.69-2.05 4.96z"/>
            </svg>
        </div>

        <!-- Botones de búsqueda -->
        <div class="buttons-container">
            <button type="button">Buscar con Google</button>
            <button type="button">Me siento con suerte</button>
        </div>
    </main>

    <!-- c. Footer -->
    <footer class="footer">
        <div class="footer-links">
            <div class="footer-left">
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Acerca de</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>
            <div class="footer-right">
                <a href="#">Privacidad</a>
                <a href="#">Condiciones</a>
                <a href="#">Preferencias</a>
            </div>
        </div>
    </footer>

</body>
</html>
